{% extends "base.html" %}

{% block page_title %}
    Home
{% endblock %}

{% block page_head %}
    Welcome to the TerpStore!
{% endblock %}

{% block page_content %}

<div class="row">
    {% for product in products %}
	<div class="col-lg-3">
		<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
			<div class="thumbnail">
				<a href="{{ url_for('product_view', product_id=product.product_id) }}">
					<img class="img-fluid" src="{{ url_for('static', filename='/images/products/' + product['product_image']) }}" alt="Picture of {{ product['product_name'] }}">
				</a>
				<div class="caption text-center">
					<h4 class="bold">{{ product.product_name }}</h4>
					<p>
						{{ product.product_description }}
					</p>
					<hr>
					<p>
                        <div>
                            <a href="{{ url_for('product_view', product_id=product.product_id) }}" class="btn btn-primary btn-sm">View</a>
                                <form action="#" method="post">
                                    <input type="hidden" name="product_quantity" value="1">
                                </form>
                        </div>
					</p>
				</div>
			</div>
		</div>
	</div>
    <div class="col-lg-1">
        &nbsp;
    </div>
    {% endfor %}

</div>


{% endblock %}
